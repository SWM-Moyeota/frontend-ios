name: TestFlight 업로드

on:
  workflow_call:
    inputs:
      build-number:
        type: string
        required: true
  # 머지 없이 다시 올릴 때 쓴다. 빌드 번호는 앞선 업로드보다 커야 한다.
  workflow_dispatch:
    inputs:
      build-number:
        description: "CFBundleVersion (예: 26110301)"
        type: string
        required: true

permissions:
  contents: read

env:
  # 개발 기기와 같은 Xcode 로 고정한다(build.yml 참고).
  DEVELOPER_DIR: /Applications/Xcode_26.3.app

jobs:
  upload:
    name: Archive 와 업로드
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # 값이 빠진 채 빌드하면 **지도가 안 뜨거나 푸시가 꺼진 앱이 조용히 올라간다.** 빌드 전에 먼저 막는다.
      - name: Check secrets
        env:
          NAVER_MAPS_CLIENT_ID: ${{ secrets.NAVER_MAPS_CLIENT_ID }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=""
          for name in NAVER_MAPS_CLIENT_ID GOOGLE_SERVICE_INFO_PLIST_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::빠진 Secrets:$missing"
            exit 1
          fi

      - name: Restore configuration
        env:
          NAVER_MAPS_CLIENT_ID: ${{ secrets.NAVER_MAPS_CLIENT_ID }}
          # 선택. 비어 있으면 그 빌드는 행동 이벤트를 보내지 않는다(docs/ANALYTICS.md) — 위 필수 검사에 넣지 않는다.
          MIXPANEL_TOKEN: ${{ secrets.MIXPANEL_TOKEN }}
          # 선택. 비어 있으면 그 빌드는 Meta 광고 설치 측정을 끈다(MetaAdsAttribution.swift).
          FACEBOOK_CLIENT_TOKEN: ${{ secrets.FACEBOOK_CLIENT_TOKEN }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          printf 'NAVER_MAPS_CLIENT_ID = %s\nMIXPANEL_TOKEN = %s\nFACEBOOK_CLIENT_TOKEN = %s\nDEVELOPMENT_TEAM = 82C22U9Z7R\n' "$NAVER_MAPS_CLIENT_ID" "$MIXPANEL_TOKEN" "$FACEBOOK_CLIENT_TOKEN" > Config/Secrets.xcconfig
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -d > Moyeota/GoogleService-Info.plist
          # API 키는 워크스페이스 밖에 둔다. 실패 로그를 아티팩트로 올릴 때 섞이지 않게 한다.
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/asc.p8"

      - name: Restore Swift packages
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/moyeota-ios-check/clones-ui
          key: spm-${{ hashFiles('Packages/MoyeotaUI/Package.resolved') }}

      - name: Archive
        env:
          BUILD_NUMBER: ${{ inputs.build-number }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          CLONES="$HOME/Library/Caches/moyeota-ios-check/clones-ui"
          xcodebuild archive -project Moyeota.xcodeproj -scheme Moyeota -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Moyeota.xcarchive" \
            -clonedSourcePackagesDirPath "$CLONES" -disableAutomaticPackageResolution \
            -skipPackagePluginValidation -skipMacroValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MOYEOTA_SPM_DIR="$CLONES" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" > "$RUNNER_TEMP/archive.log" 2>&1 \
            || { grep -E "error:|\*\* .* \*\*" "$RUNNER_TEMP/archive.log" | tail -40; exit 1; }

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Moyeota.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist .github/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8" Moyeota/GoogleService-Info.plist Config/Secrets.xcconfig
